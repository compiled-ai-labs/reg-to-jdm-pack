[project]
name = "reg-to-jdm-pack"
version = "0.1.0"
description = "A compiled rule pack for GoRules (JDM) and Camunda (DMN), with its receipts, tests and verifier"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Boris Teplitsky", email = "boristep@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "zen-engine==2.1.2",
]

[project.scripts]
reg-to-jdm = "reg_to_jdm.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "reg_to_jdm"
